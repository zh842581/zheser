name: 连通性诊断 Connectivity Test

on:
  workflow_dispatch:        # 手动触发：Actions 页面 → 此工作流 → Run workflow
  push:
    paths:
      - '.github/workflows/connectivity-test.yml'
      - '.github/scripts/conn_test.py'

jobs:
  conn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: Python 环境
        run: python3 --version
      - name: 运行端点可达性诊断
        run: python3 .github/scripts/conn_test.py
