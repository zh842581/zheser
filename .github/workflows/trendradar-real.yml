name: TrendRadar 健康热点(官方真正版)

on:
  schedule:
    - cron: "30 23 * * *"   # UTC 23:30 = 北京时间 07:30
  workflow_dispatch:        # 允许在 Actions 页面手动点 "Run workflow" 立即测试

permissions:
  contents: read

jobs:
  trendradar:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含关键词配置）
        uses: actions/checkout@v4

      - name: 运行官方 TrendRadar 镜像（抓取+关键词筛选+AI简报+钉钉推送）
        env:
          TZ: Asia/Shanghai
          # 钉钉推送：用你已有的 secret（值是完整 webhook URL）。
          # ⚠️ 前置要求：你那个钉钉机器人当前是「加签」安全模式，
          #    TrendRadar 大概率不支持加签，请去钉钉把机器人安全设置
          #    改成「自定义关键词」（关键词随便填，如「健康」「热点」），否则推送会被拒。
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK }}
          # 硅基流动 AI 分析（OpenAI 兼容协议）
          AI_ANALYSIS_ENABLED: "true"
          AI_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          AI_MODEL: "Qwen/Qwen3-VL-8B-Instruct"
          AI_BASE_URL: "https://api.siliconflow.cn/v1"
          AI_PROVIDER: "openai"
          # 单次运行：Actions 本身就是定时器，跑完即退出（不要常驻）
          RUN_MODE: "once"
          IMMEDIATE_RUN: "true"
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/trendradar-real/frequency_words.txt:/app/config/frequency_words.txt" \
            -e TZ \
            -e DINGTALK_WEBHOOK_URL \
            -e AI_ANALYSIS_ENABLED -e AI_API_KEY -e AI_MODEL -e AI_BASE_URL -e AI_PROVIDER \
            -e RUN_MODE -e IMMEDIATE_RUN \
            wantcat/trendradar:latest

# 说明（部署前必读）：
# 1) 本工作流用官方 Docker 镜像 wantcat/trendradar，不需要 clone 源码，Actions 原生可拉取。
# 2) 关键词文件用仓库内 trendradar-real/frequency_words.txt（健康管理大类 + 屏蔽八卦）。
# 3) 需实测两点：
#    a. newsnow 数据源在 GitHub 美国服务器访问国内平台（微博/知乎/B站）可能不稳，
#       可能只抓到头条/百度；若抓不到想要的平台，再考虑回退到自建抓取或换源。
#    b. RUN_MODE=once 若不被支持导致容器挂起/超时，把日志发我，我改成 `python manage.py run`。
# 4) 部署后请在 Actions 页面 Run workflow 看一次日志验证；旧的自建版 daily_hotspot.yml
#    若仍在，请在其设置里 Disable，避免两个 7:30 重复推钉钉。
